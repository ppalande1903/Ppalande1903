<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="About: AI &amp; Data Science graduate doing an M.Sc. in Computer Science at University College Dublin. 4+ internships, 1 published paper, 9.01 GPA."><title>About: AI &amp; Data Science graduate doing an M.Sc. in Computer Science at University College Dublin. 4+ internships, 1 published paper, 9.01 GPA.</title><style>@font-face{font-family:'pa-light';src:url(data:font/woff2;base64,) format('woff2')}.light{font-family:'pa-light','Helvetica Neue',Helvetica,Arial,sans-serif}@font-face{font-family:'pa-mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'pa-mono','Helvetica Neue',Helvetica,Arial,sans-serif}@font-face{font-family:'pa-thin';src:url(data:font/woff2;base64,) format('woff2')}.thin{font-family:'pa-thin','Helvetica Neue',Helvetica,Arial,sans-serif}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="#fafafa" stroke="#dcdcdc"/><text x="48" y="118" font-size="76" fill="#0a0a0a" text-anchor="start" letter-spacing="-1"><tspan class="thin">ABOUT</tspan></text><text x="48" y="186" font-size="20" fill="#0a0a0a" text-anchor="start" letter-spacing="0"><tspan class="light">I'm an AI &amp; Data Science graduate, now doing an M.Sc. in</tspan></text><text x="48" y="217" font-size="20" fill="#0a0a0a" text-anchor="start" letter-spacing="0"><tspan class="light">Computer Science at University College Dublin. I like</tspan></text><text x="48" y="248" font-size="20" fill="#0a0a0a" text-anchor="start" letter-spacing="0"><tspan class="light">building tech that feels kind: a keyboard you type with</tspan></text><text x="48" y="279" font-size="20" fill="#0a0a0a" text-anchor="start" letter-spacing="0"><tspan class="light">your eyes, a tool that tells you if your rent is fair.</tspan></text><text x="48" y="310" font-size="20" fill="#0a0a0a" text-anchor="start" letter-spacing="0"><tspan class="light">For me, AI is a way to make the world more accessible.</tspan></text><text x="760" y="248" font-size="76" fill="#0a0a0a" text-anchor="middle" letter-spacing="-2"><tspan class="thin">4+</tspan></text><text x="760" y="284" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.5"><tspan class="mono">INTERNSHIPS</tspan></text><text x="920" y="248" font-size="76" fill="#0a0a0a" text-anchor="middle" letter-spacing="-2"><tspan class="thin">1</tspan></text><text x="920" y="284" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.5"><tspan class="mono">PUBLISHED PAPER</tspan></text><text x="1080" y="248" font-size="76" fill="#0a0a0a" text-anchor="middle" letter-spacing="-2"><tspan class="thin">9.01</tspan></text><text x="1080" y="284" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.5"><tspan class="mono">GPA</tspan></text><line x1="700" y1="150" x2="700" y2="330" stroke="#dcdcdc"/></svg>