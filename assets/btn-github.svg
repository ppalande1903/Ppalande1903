<svg xmlns="http://www.w3.org/2000/svg" width="175" height="40" viewBox="0 0 175 40" role="img" aria-label="FOLLOW ON GITHUB"><title>FOLLOW ON GITHUB</title><style>@font-face{font-family:'DM Sans';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.sf{font-family:'Instrument Serif',Georgia,serif}.si{font-family:'Instrument Serif',Georgia,serif;font-style:italic}.ps{font-family:'Pinyon Script',cursive}.cv{font-family:'Caveat',cursive;font-weight:600}.dm{font-family:'DM Sans',Helvetica,Arial,sans-serif;font-weight:500}.db{font-family:'DM Sans',Helvetica,Arial,sans-serif;font-weight:700}.sk{font-family:'Shrikhand',Georgia,serif}
